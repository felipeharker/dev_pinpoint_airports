services:
  - type: web
    name: pinpoint-airports
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /js/*
        name: Cache-Control
        value: public, max-age=300
